openapi: 3.1.0
info:
  title: Theater Seat Scheduling API
  description: Microservice for managing movie scheduling within theater rooms, including showtime creation, updates, and retrieval.
  version: 1.0.0
  contact:
    name: API Support
    email: support@cinema.io

servers:
  - url: http://localhost:8082
    description: Local Development Server

tags:
  - name: Schedule Movies
    description: Operations related to movie scheduling within theater rooms
  - name: Movies
    description: Operations related to movie information retrieval for scheduling

paths:
  /api/v1/theaters/{theaterId}/schedule-movies/{roomId}:
    get:
      tags:
        - Schedule Movies
      summary: Get scheduled movies for a room
      description: Retrieves a paginated list of scheduled movies for a specific theater room.
      operationId: getScheduledMovies
      parameters:
        - name: theaterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the theater
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the room
        - name: page
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 0
          description: Page number (0-based)
        - name: size
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
          description: Number of items per page
      responses:
        "200":
          description: Successfully retrieved the list of scheduled movies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledMovieResponseDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Schedule Movies
      summary: Create a new movie schedule
      description: Creates a new movie schedule entry for a specific theater room. Requires EMPLOYEE role.
      operationId: saveScheduleMovie
      security:
        - bearerAuth: []
      parameters:
        - name: theaterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the theater
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleMovieRequestDTO"
      responses:
        "201":
          description: Movie schedule created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledMovieResponseDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
        - Schedule Movies
      summary: Update a movie schedule
      description: Updates an existing movie schedule entry. Requires EMPLOYEE role.
      operationId: updateScheduleMovie
      security:
        - bearerAuth: []
      parameters:
        - name: theaterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the theater
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the room
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the schedule entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleMovieRequestDTO"
      responses:
        "200":
          description: Movie schedule updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledMovieResponseDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Schedule Movies
      summary: Delete a movie schedule
      description: Deletes a movie schedule entry by its ID. Requires EMPLOYEE role.
      operationId: deleteScheduleMovie
      security:
        - bearerAuth: []
      parameters:
        - name: theaterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the theater
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the room
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the schedule entry
      responses:
        "200":
          description: Movie schedule deleted successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Provide the JWT token issued by Keycloak to access Employee endpoints.

  responses:
    BadRequest:
      description: Bad Request. Occurs when validation fails or business rules are violated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BaseErrorDto"
          example:
            message: "Invalid Request. Field validations failed."
            code: "CINEMA-001"
            status: "BAD_REQUEST"

    Unauthorized:
      description: Unauthorized. Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BaseErrorDto"
          example:
            message: "Unauthorized."
            code: "CINEMA-005"
            status: "UNAUTHORIZED"

    Forbidden:
      description: Forbidden. Authenticated user lacks required authorities (e.g., HasEmployeeRole missing).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BaseErrorDto"
          example:
            message: "Forbidden. Access Denied."
            code: "CINEMA-004"
            status: "FORBIDDEN"

    NotFound:
      description: Not Found. The requested entity does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BaseErrorDto"
          example:
            message: "The requested entity could not be found."
            code: "CINEMA-001"
            status: "NOT_FOUND"

    InternalServerError:
      description: Internal Server Error. Raised directly by generic Exceptions or Database transaction failures.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BaseErrorDto"
          examples:
            TechnicalError:
              summary: Custom DB/Technical Exception
              value:
                message: "DB error during operation"
                code: "CINEMA-002"
                status: "INTERNAL_SERVER_ERROR"

  schemas:
    BaseErrorDto:
      description: Standardized error payload handled by ExceptionHandlers and generated from CinemaExceptionTypes.
      type: object
      properties:
        message:
          type: string
          description: A specific message describing the nature of the error.
        code:
          type: string
          description: A predefined internal code string representing the type of error.
        status:
          type: string
          description: String representation of the Spring HttpStatus enum.
      required:
        - message
        - code
        - status

    ScheduleMovieRequestDTO:
      type: object
      required:
        - movieId
        - start
        - end
      properties:
        movieId:
          type: string
          format: uuid
          description: UUID of the movie to schedule
        start:
          type: string
          format: date-time
          description: Start time of the movie showing (must be present or future)
        end:
          type: string
          format: date-time
          description: End time of the movie showing (must be future)
      description: Request DTO for creating or updating a movie schedule. Validates that end is after start.

    ScheduledMovieResponseDTO:
      type: object
      properties:
        movieId:
          type: string
          format: uuid
          description: UUID of the scheduled movie
        title:
          type: string
          description: Title of the movie
        posterUrl:
          type: string
          description: URL of the movie poster
        start:
          type: string
          format: date-time
          description: Start time of the showing
        end:
          type: string
          format: date-time
          description: End time of the showing

    MoviesBatchRequestDTO:
      type: object
      required:
        - movieIds
      properties:
        movieIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          uniqueItems: true
          description: Set of movie UUIDs to retrieve

    MovieInfoResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the movie
        title:
          type: string
          description: Title of the movie
        description:
          type: string
          description: Description of the movie
        releaseDate:
          type: string
          format: date
          description: Release date of the movie
        posterUrl:
          type: string
          description: URL of the movie poster
        backdropUrl:
          type: string
          description: URL of the movie backdrop